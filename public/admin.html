<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت نوبت‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); padding: 30px 15px; direction: rtl; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 25px;
        }

        h2 { text-align: center; color: var(--text-light); margin-bottom: 25px; font-weight: 800; font-size: 22px; }
        
        .login-box { max-width: 400px; margin: 0 auto; text-align: center; }
        
        input { 
            width: 100%;
            padding: 12px 16px; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 15px; 
            background-color: #0f172a;
            color: #fff;
            text-align: center;
        }
        input:focus { outline: none; border-color: var(--accent-blue); }

        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .btn-primary { background-color: var(--accent-blue); color: white; width: 100%; }
        .btn-excel { background-color: var(--accent-green); color: white; }
        .btn-danger { background-color: var(--accent-red); color: white; padding: 6px 12px; font-size: 12px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: center; font-size: 13.5px; }
        th, td { border-bottom: 1px solid #334155; padding: 14px 10px; }
        th { background-color: #0f172a; color: var(--text-muted); font-weight: 700; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- فرم ورود -->
        <div id="loginBox" class="card login-box">
            <h2>ورود به مدیریت</h2>
            <input type="text" id="username" placeholder="نام کاربری">
            <input type="password" id="password" placeholder="رمز عبور">
            <button class="btn-primary" onclick="login()">ورود به سیستم</button>
            <div id="loginErr" style="color: var(--accent-red); margin-top: 12px; font-size: 13px;"></div>
        </div>

        <!-- پنل اصلی -->
        <div id="adminPanel" class="card" style="display: none;">
            <div class="top-bar">
                <span id="userInfo" style="font-weight: 700; color: var(--accent-blue); font-size: 15px;"></span>
                <button class="btn-excel" onclick="downloadExcel()">دانلود خروجی اکسل</button>
            </div>

            <!-- بخش ساخت ادمین -->
            <div id="superAdminSection" style="display: none; background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                <h3 style="font-size: 15px; margin-bottom: 15px; color: var(--accent-blue);">افزودن دسترسی ادمین جدید</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newUsername" placeholder="نام کاربری" style="margin:0;">
                    <input type="password" id="newPassword" placeholder="رمز عبور" style="margin:0;">
                    <button class="btn-primary" onclick="createAdmin()" style="width: auto; white-space: nowrap;">ثبت ادمین</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>کد</th>
                        <th>نام و نام خانوادگی</th>
                        <th>شماره دانشجویی</th>
                        <th>تاریخ نوبت</th>
                        <th>ساعت</th>
                        <th id="actionHeader">عملیات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        let authHeader = '';
        let currentUserRole = '';

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            authHeader = 'Basic ' + btoa(u + ':' + p);

            try {
                const res = await fetch('/api/admin/login', { headers: { 'Authorization': authHeader } });
                const data = await res.json();
                if (res.ok) {
                    currentUserRole = data.role;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('userInfo').innerText = `نقش فعلی: ${currentUserRole === 'super' ? 'سوپر ادمین' : 'ادمین معمولی'}`;
                    
                    if (currentUserRole === 'super') {
                        document.getElementById('superAdminSection').style.display = 'block';
                    } else {
                        document.getElementById('actionHeader').style.display = 'none';
                    }
                    loadAppointments();
                } else {
                    document.getElementById('loginErr').innerText = 'اطلاعات ورود اشتباه است.';
                }
            } catch (err) {
                document.getElementById('loginErr').innerText = 'خطا در شبکه.';
            }
        }

        async function loadAppointments() {
            const res = await fetch('/api/admin/list', { headers: { 'Authorization': authHeader } });
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                let actionTd = currentUserRole === 'super' ? `<td><button class="btn-danger" onclick="deleteAppointment(${item.id})">حذف</button></td>` : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.fullname}</td>
                        <td>${item.student_id}</td>
                        <td>${item.date_shamsi}</td>
                        <td style="color: var(--accent-blue); font-weight:700;">${item.time_slot}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        async function createAdmin() {
            const u = document.getElementById('newUsername').value;
            const p = document.getElementById('newPassword').value;
            if (!u || !p) return alert('نام کاربری و رمز را تکمیل کنید.');

            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
                body: JSON.stringify({ username: u, password: p, role: 'admin' })
            });
            if (res.ok) {
                alert('ادمین جدید ساخته شد.');
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
            } else {
                alert('خطا در تعریف ادمین.');
            }
        }

        function downloadExcel() {
            window.location.href = `/api/admin/export-excel?auth=${encodeURIComponent(authHeader)}`;
        }

        async function deleteAppointment(id) {
            if (!confirm('آیا این نوبت حذف شود؟')) return;
            const res = await fetch(`/api/admin/delete/${id}`, { method: 'DELETE', headers: { 'Authorization': authHeader } });
            if (res.ok) loadAppointments();
        }
    </script>
</body>
</html>
