<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت نوبت‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .login-box, .admin-section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #0056b3; color: white; }
        .btn-excel { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: center; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background-color: #e9ecef; }
    </style>
</head>
<body>
    <div class="container">
        <h2>پنل مدیریت نوبت‌دهی</h2>
        
        <div id="loginBox" class="login-box">
            <input type="text" id="username" placeholder="نام کاربری">
            <input type="password" id="password" placeholder="رمز عبور">
            <button class="btn-primary" onclick="login()">ورود به سیستم</button>
            <div id="loginErr" style="color: red; margin-top: 10px;"></div>
        </div>

        <div id="adminPanel" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="userInfo" style="font-weight: bold; color: #2b6cb0;"></span>
                <button class="btn-excel" onclick="downloadExcel()">دانلود خروجی اکسل</button>
            </div>

            <!-- بخش مخصوص سوپر ادمین برای ساخت ادمین جدید -->
            <div id="superAdminSection" class="admin-section" style="display: none; margin-top: 20px;">
                <h3>تعریف ادمین جدید (مخصوص سوپر ادمین)</h3>
                <input type="text" id="newUsername" placeholder="نام کاربری جدید">
                <input type="password" id="newPassword" placeholder="رمز عبور جدید">
                <button class="btn-primary" onclick="createAdmin()">افزودن ادمین</button>
            </div>

            <table id="appTable">
                <thead>
                    <tr>
                        <th>کد پیگیری</th>
                        <th>نام و نام خانوادگی</th>
                        <th>شماره دانشجویی</th>
                        <th>تاریخ نوبت</th>
                        <th>ساعت</th>
                        <th id="actionHeader">عملیات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let authHeader = '';
        let currentUserRole = '';

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            authHeader = 'Basic ' + btoa(u + ':' + p);

            try {
                const res = await fetch('/api/admin/login', { headers: { 'Authorization': authHeader } });
                const data = await res.json();
                if (res.ok) {
                    currentUserRole = data.role;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('userInfo').innerText = `ورود با نقش: ${currentUserRole === 'super' ? 'سوپر ادمین' : 'ادمین معمولی'}`;
                    
                    if (currentUserRole === 'super') {
                        document.getElementById('superAdminSection').style.display = 'block';
                    } else {
                        document.getElementById('actionHeader').style.display = 'none';
                    }
                    loadAppointments();
                } else {
                    document.getElementById('loginErr').innerText = 'نام کاربری یا رمز عبور اشتباه است.';
                }
            } catch (err) {
                document.getElementById('loginErr').innerText = 'خطا در برقراری ارتباط.';
            }
        }

        async function loadAppointments() {
            const res = await fetch('/api/admin/list', { headers: { 'Authorization': authHeader } });
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                let actionTd = currentUserRole === 'super' ? `<td><button class="btn-danger" onclick="deleteAppointment(${item.id})">حذف</button></td>` : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.fullname}</td>
                        <td>${item.student_id}</td>
                        <td>${item.date_shamsi}</td>
                        <td>${item.time_slot}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        async function createAdmin() {
            const u = document.getElementById('newUsername').value;
            const p = document.getElementById('newPassword').value;
            if (!u || !p) return alert('نام کاربری و رمز را وارد کنید.');

            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
                body: JSON.stringify({ username: u, password: p, role: 'admin' })
            });
            if (res.ok) {
                alert('ادمین جدید با موفقیت ساخته شد.');
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
            } else {
                alert('خطا در تعریف ادمین.');
            }
        }

        function downloadExcel() {
            window.location.href = `/api/admin/export-excel?auth=${encodeURIComponent(authHeader)}`;
        }

        async function deleteAppointment(id) {
            if (!confirm('آیا از حذف این نوبت اطمینان دارید؟')) return;
            const res = await fetch(`/api/admin/delete/${id}`, { method: 'DELETE', headers: { 'Authorization': authHeader } });
            if (res.ok) {
                loadAppointments();
            } else {
                alert('خطا در حذف نوبت.');
            }
        }
    </script>
</body>
</html>
