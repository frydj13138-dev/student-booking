<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه نوبت‌دهی دانشجویی | مجتمع آموزشی الهیه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-accent: #38bdf8;
            --mashhad-unit-color: #1e40af; /* آبی پررنگ برای واحد مشهد */
            --sub-badge-bg: #ffffff;        /* پس‌زمینه روشن برای دیده شدن متن مشکی */
            --sub-badge-text: #000000;      /* متن مشکی برای سامانه نوبت‌دهی */
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            background: var(--bg-gradient);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            color: var(--text-light);
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 440px; 
            padding: 40px 32px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease-out;
        }

        .header-title { text-align: center; margin-bottom: 28px; }
        
        /* مجتمع آموزشی الهیه - فوق‌العاده بلد و درشت */
        .header-title h1 { 
            font-size: 26px; 
            color: var(--text-light); 
            font-weight: 900; 
            letter-spacing: -0.5px; 
            margin-bottom: 6px;
        }
        
        /* دانشگاه آزاد اسلامی مشهد - آبی پررنگ */
        .header-title h2 { 
            font-size: 16px; 
            color: var(--mashhad-unit-color); 
            font-weight: 800; 
        }

        /* سامانه نوبت‌دهی - متن مشکی، فوق‌العاده بلد */
        .header-title .subtitle { 
            display: inline-block;
            margin-top: 14px;
            padding: 8px 22px;
            background: var(--sub-badge-bg);
            color: var(--sub-badge-text);
            font-size: 15px;
            font-weight: 900;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .form-group { margin-bottom: 22px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #cbd5e1; }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 14px; 
            text-align: center; 
            background-color: var(--input-bg);
            transition: all 0.25s ease;
            color: var(--text-light);
            font-weight: 600;
        }

        input:focus { 
            border-color: var(--primary-accent); 
            outline: none; 
            background-color: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        button.btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }

        button.btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px rgba(2, 132, 199, 0.45); 
        }

        #resultMessage { margin-top: 18px; font-size: 13.5px; text-align: center; font-weight: 600; }

        .ticket-card { 
            background: rgba(15, 23, 42, 0.7);
            border: 1px dashed rgba(255, 255, 255, 0.2); 
            padding: 24px; 
            border-radius: 16px; 
            margin-top: 25px; 
            text-align: right; 
            animation: fadeIn 0.4s ease;
        }

        .ticket-title {
            text-align: center; 
            color: var(--primary-accent); 
            font-size: 16px; 
            font-weight: 800;
            margin-bottom: 18px; 
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .ticket-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13.5px; }
        .ticket-row span { color: var(--text-muted); }
        .ticket-row strong { color: var(--text-light); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-title">
            <h1>مجتمع آموزشی الهیه</h1>
            <h2>دانشگاه آزاد اسلامی مشهد</h2>
            <div class="subtitle">سامانه نوبت‌دهی دانشجویی</div>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="fullname" required placeholder="مثال: علی محمدی">
            </div>
            <div class="form-group">
                <label>شماره دانشجویی:</label>
                <input type="text" id="student_id" required placeholder="مثال: 402111216">
            </div>
            <div class="form-group">
                <label>تاریخ نوبت (صرفاً ۱۴ الی ۲۰ شهریور):</label>
                <input type="text" id="target_date" class="pdate" required readonly placeholder="کلیک جهت انتخاب تاریخ">
            </div>
            <button type="submit" class="btn-submit">ثبت و دریافت نوبت</button>
        </form>

        <div id="resultMessage"></div>

        <div id="ticketSection" class="ticket-card" style="display: none;">
            <div class="ticket-title">رسید رسمی نوبت‌دهی</div>
            <div class="ticket-row"><span>کد پیگیری:</span><strong id="t-id"></strong></div>
            <div class="ticket-row"><span>نام و نام خانوادگی:</span><strong id="t-name"></strong></div>
            <div class="ticket-row"><span>شماره دانشجویی:</span><strong id="t-sid"></strong></div>
            <div class="ticket-row"><span>تاریخ نوبت:</span><strong id="t-date"></strong></div>
            <div class="ticket-row"><span>ساعت حضور:</span><strong id="t-time" style="color: #4ade80; font-size: 15px;"></strong></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.pdate').persianDatepicker({
                format: 'YYYY/MM/DD',
                autoClose: true,
                persianDigit: false,
                onlySelectOnDate: true,
                checkDate: function(unix) {
                    var pdate = new persianDate(unix);
                    return pdate.month() === 6 && pdate.date() >= 14 && pdate.date() <= 20;
                }
            });
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('resultMessage');
            const ticketDiv = document.getElementById('ticketSection');
            resultDiv.innerHTML = '<span style="color: #38bdf8;">در حال پردازش نوبت...</span>';
            ticketDiv.style.display = 'none';

            try {
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullname: document.getElementById('fullname').value,
                        student_id: document.getElementById('student_id').value,
                        target_date: document.getElementById('target_date').value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = '<span style="color: #4ade80; font-size: 15px;">✓ نوبت شما با موفقیت ثبت شد</span>';
                    document.getElementById('t-id').innerText = data.appointment.id;
                    document.getElementById('t-name').innerText = data.appointment.fullname;
                    document.getElementById('t-sid').innerText = data.appointment.student_id;
                    document.getElementById('t-date').innerText = data.appointment.date_shamsi;
                    document.getElementById('t-time').innerText = data.appointment.time_slot;
                    ticketDiv.style.display = 'block';
                    document.getElementById('bookingForm').style.display = 'none';
                } else {
                    resultDiv.innerHTML = `<span style="color: #f87171;">${data.error || 'خطا در ثبت نوبت.'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span style="color: #f87171;">خطا در برقراری ارتباط با سرور.</span>';
            }
        });
    </script>
</body>
</html>
