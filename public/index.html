<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه نوبت‌دهی دانشجویی | مجتمع آموزشی الهیه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #1e3a8a;
            --primary-accent: #3b82f6;
            --gold-accent: #d97706;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            color: var(--text-dark);
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 450px; 
            padding: 40px 32px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out;
        }

        .header-title { text-align: center; margin-bottom: 28px; }
        .header-title h1 { font-size: 22px; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
        .header-title h2 { font-size: 14px; color: var(--gold-accent); margin-top: 4px; font-weight: 700; }
        .header-title .subtitle { 
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: #f1f5f9;
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 600;
            border-radius: 20px;
        }

        .form-group { margin-bottom: 22px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #334155; }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 14px; 
            text-align: center; 
            background-color: #f8fafc;
            transition: all 0.25s ease;
            color: var(--text-dark);
            font-weight: 600;
        }

        input:focus { 
            border-color: var(--primary-accent); 
            background-color: #fff; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        button.btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.3);
            transition: all 0.2s ease;
        }

        button.btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px rgba(30, 58, 138, 0.4); 
        }

        #resultMessage { margin-top: 18px; font-size: 13.5px; text-align: center; font-weight: 600; }

        .ticket-card { 
            background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
            border: 2px dashed #cbd5e1; 
            padding: 24px; 
            border-radius: 16px; 
            margin-top: 25px; 
            text-align: right; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            animation: fadeIn 0.4s ease;
        }

        .ticket-title {
            text-align: center; 
            color: var(--primary); 
            font-size: 16px; 
            font-weight: 800;
            margin-bottom: 18px; 
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .ticket-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13.5px; }
        .ticket-row span { color: var(--text-muted); }
        .ticket-row strong { color: var(--text-dark); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-title">
            <h1>مجتمع آموزشی الهیه</h1>
            <h2>دانشگاه آزاد اسلامی مشهد</h2>
            <div class="subtitle">سامانه نوبت‌دهی دانشجویی</div>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="fullname" required placeholder="مثال: علی محمدی">
            </div>
            <div class="form-group">
                <label>شماره دانشجویی:</label>
                <input type="text" id="student_id" required placeholder="مثال: 402111216">
            </div>
            <div class="form-group">
                <label>تاریخ نوبت (صرفاً ۱۴ الی ۲۰ شهریور):</label>
                <input type="text" id="target_date" class="pdate" required readonly placeholder="کلیک جهت انتخاب تاریخ">
            </div>
            <button type="submit" class="btn-submit">ثبت و دریافت نوبت</button>
        </form>

        <div id="resultMessage"></div>

        <div id="ticketSection" class="ticket-card" style="display: none;">
            <div class="ticket-title">رسید رسمی نوبت‌دهی</div>
            <div class="ticket-row"><span>کد پیگیری:</span><strong id="t-id"></strong></div>
            <div class="ticket-row"><span>نام و نام خانوادگی:</span><strong id="t-name"></strong></div>
            <div class="ticket-row"><span>شماره دانشجویی:</span><strong id="t-sid"></strong></div>
            <div class="ticket-row"><span>تاریخ نوبت:</span><strong id="t-date"></strong></div>
            <div class="ticket-row"><span>ساعت حضور:</span><strong id="t-time" style="color: #dc2626; font-size: 15px;"></strong></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script>
        $(document).ready(function() {
            // محدوده دقیق زمان بر حسب میلی‌ثانیه برای ۱۴ تا ۲۰ شهریور ۱۴۰۳
            var minD = new persianDate([1403, 6, 14]).valueOf();
            var maxD = new persianDate([1403, 6, 20]).valueOf();

            $('.pdate').persianDatepicker({
                format: 'YYYY/MM/DD',
                autoClose: true,
                minDate: minD,
                maxDate: maxD,
                persianDigit: false,
                onlySelectOnDate: true,
                checkDate: function(unix) {
                    var pdate = new persianDate(unix);
                    // قفل‌سازی کامل: غیرفعال‌سازی روزهای خارج از بازه ۱۴ تا ۲۰ شهریور ۱۴۰۳
                    return pdate.year() === 1403 && pdate.month() === 6 && pdate.date() >= 14 && pdate.date() <= 20;
                }
            });
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('resultMessage');
            const ticketDiv = document.getElementById('ticketSection');
            resultDiv.innerHTML = '<span style="color: #2563eb;">در حال پردازش نوبت...</span>';
            ticketDiv.style.display = 'none';

            try {
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullname: document.getElementById('fullname').value,
                        student_id: document.getElementById('student_id').value,
                        target_date: document.getElementById('target_date').value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = '<span style="color: #16a34a; font-size: 15px;">✓ نوبت شما با موفقیت ثبت شد</span>';
                    document.getElementById('t-id').innerText = data.appointment.id;
                    document.getElementById('t-name').innerText = data.appointment.fullname;
                    document.getElementById('t-sid').innerText = data.appointment.student_id;
                    document.getElementById('t-date').innerText = data.appointment.date_shamsi;
                    document.getElementById('t-time').innerText = data.appointment.time_slot;
                    ticketDiv.style.display = 'block';
                    document.getElementById('bookingForm').style.display = 'none';
                } else {
                    resultDiv.innerHTML = `<span style="color: #dc2626;">${data.error || 'خطا در ثبت نوبت.'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span style="color: #dc2626;">خطا در برقراری ارتباط با سرور.</span>';
            }
        });
    </script>
</body>
</html>
