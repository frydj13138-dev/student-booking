<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه نوبت‌دهی دانشجویی - مجتمع آموزشی الهیه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; width: 100%; max-width: 440px; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .header-title { text-align: center; margin-bottom: 25px; }
        .header-title h1 { font-size: 22px; color: #0056b3; font-weight: 800; }
        .header-title h2 { font-size: 15px; color: #4a5568; margin-top: 4px; font-weight: 600; }
        .header-title p { font-size: 13px; color: #718096; margin-top: 8px; border-top: 1px dashed #cbd5e0; padding-top: 8px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #2d3748; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e0; border-radius: 10px; font-size: 14px; text-align: center; background-color: #f7fafc; }
        input:focus { border-color: #0056b3; background-color: #fff; outline: none; }
        button.btn-submit { width: 100%; padding: 14px; background-color: #0056b3; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
        #resultMessage { margin-top: 18px; font-size: 13.5px; text-align: center; font-weight: 600; }
        .ticket-card { background: #f4f9ff; border: 1.5px dashed #0056b3; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: right; }
        .ticket-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13.5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">
            <h1>مجتمع آموزشی الهیه</h1>
            <h2>دانشگاه آزاد مشهد</h2>
            <p>سامانه نوبت‌دهی دانشجویی</p>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="fullname" required placeholder="مثال: علی محمدی">
            </div>
            <div class="form-group">
                <label>شماره دانشجویی:</label>
                <input type="text" id="student_id" required placeholder="مثال: 402111216">
            </div>
            <div class="form-group">
                <label>تاریخ نوبت (۱۴ الی ۲۰ شهریور):</label>
                <input type="text" id="target_date" class="pdate" required readonly placeholder="جهت انتخاب تاریخ کلیک کنید">
            </div>
            <button type="submit" class="btn-submit">ثبت و دریافت نوبت</button>
        </form>

        <div id="resultMessage"></div>

        <div id="ticketSection" class="ticket-card" style="display: none;">
            <h3 style="text-align: center; color: #0056b3; margin-bottom: 15px;">رسید نوبت‌دهی</h3>
            <div class="ticket-row"><span>کد پیگیری:</span><strong id="t-id"></strong></div>
            <div class="ticket-row"><span>نام:</span><strong id="t-name"></strong></div>
            <div class="ticket-row"><span>شماره دانشجویی:</span><strong id="t-sid"></strong></div>
            <div class="ticket-row"><span>تاریخ نوبت:</span><strong id="t-date"></strong></div>
            <div class="ticket-row"><span>ساعت حضور:</span><strong id="t-time" style="color: #e53e3e;"></strong></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script>
        $(document).ready(function() {
            // ساخت شیء تاریخ برای محدودسازی تقویم به ۱۴ تا ۲۰ شهریور
            var minD = new persianDate([1403, 6, 14]).valueOf();
            var maxD = new persianDate([1403, 6, 20]).valueOf();

            $('.pdate').persianDatepicker({
                format: 'YYYY/MM/DD',
                autoClose: true,
                minDate: minD,
                maxDate: maxD,
                persianDigit: false
            });
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('resultMessage');
            const ticketDiv = document.getElementById('ticketSection');
            resultDiv.innerHTML = 'در حال ثبت نوبت...';
            ticketDiv.style.display = 'none';

            try {
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullname: document.getElementById('fullname').value,
                        student_id: document.getElementById('student_id').value,
                        target_date: document.getElementById('target_date').value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = '<span style="color: green;">✓ نوبت با موفقیت ثبت شد.</span>';
                    document.getElementById('t-id').innerText = data.appointment.id;
                    document.getElementById('t-name').innerText = data.appointment.fullname;
                    document.getElementById('t-sid').innerText = data.appointment.student_id;
                    document.getElementById('t-date').innerText = data.appointment.date_shamsi;
                    document.getElementById('t-time').innerText = data.appointment.time_slot;
                    ticketDiv.style.display = 'block';
                    document.getElementById('bookingForm').style.display = 'none';
                } else {
                    resultDiv.innerHTML = `<span style="color: red;">${data.error || 'خطا در ثبت نوبت.'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span style="color: red;">خطا در ارتباط با سرور.</span>';
            }
        });
    </script>
</body>
</html>
